[project]
name = "aiocometd"
version = "0.4.5+kahoot.1"
description = "CometD client for asyncio (vendored, patched for Python 3.10+)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Robert Marki", email = "gsmiko@gmail.com" }]
dependencies = ["aiohttp>=3.8,<4.0"]

[project.urls]
Homepage = "http://aiocometd.readthedocs.io/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiocometd"]
